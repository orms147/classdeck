<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="ClassDeck">
<title>{{title}}</title>
<style>
/* --- structure: stage, slides, blocks, teacher layer, print ---------------------------------- */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
    "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

.stage-wrap {
  position: fixed;
  inset: 0;
  background: var(--bg);
}

.stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
  overflow: hidden;
  background: var(--bg);
}

/* -- slides */

.slide {
  display: none;
  position: absolute;
  inset: 0;
  flex-direction: column;
  padding: 72px 96px 120px;
  font-size: var(--size-body, 40px);
  line-height: 1.25;
}

.slide.active {
  display: flex;
  animation: slide-in 320ms ease-out;
}

@keyframes slide-in {
  from { opacity: 0; transform: translateX(24px); }
  to { opacity: 1; transform: none; }
}

.band {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 24px;
  background: var(--phase-lesson);
}

.slide[data-phase="warm_up"] .band,
.slide[data-slide-type="divider"][data-phase="warm_up"],
.phase-strip li[data-phase="warm_up"] .chip,
.dot[data-phase="warm_up"]::before { background: var(--phase-warm_up); }

.slide[data-phase="presentation"] .band,
.slide[data-slide-type="divider"][data-phase="presentation"],
.phase-strip li[data-phase="presentation"] .chip,
.dot[data-phase="presentation"]::before { background: var(--phase-presentation); }

.slide[data-phase="practice"] .band,
.slide[data-slide-type="divider"][data-phase="practice"],
.phase-strip li[data-phase="practice"] .chip,
.dot[data-phase="practice"]::before { background: var(--phase-practice); }

.slide[data-phase="production"] .band,
.slide[data-slide-type="divider"][data-phase="production"],
.phase-strip li[data-phase="production"] .chip,
.dot[data-phase="production"]::before { background: var(--phase-production); }

.slide[data-phase="wrap_up"] .band,
.slide[data-slide-type="divider"][data-phase="wrap_up"],
.phase-strip li[data-phase="wrap_up"] .chip,
.dot[data-phase="wrap_up"]::before { background: var(--phase-wrap_up); }

.dot[data-phase="lesson"]::before { background: var(--phase-lesson); }

.slide[data-phase="teacher"] .band,
.dot[data-phase="teacher"]::before { background: var(--phase-teacher); }

.slide-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 32px;
  text-align: center;
}

body.teacher-mode.notes-open .slide:not(.teacher) .slide-body {
  margin-right: 620px;
}

.slide-title {
  margin: 0;
  font-size: var(--size-title, 64px);
  font-weight: 700;
  line-height: 1.15;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 48px 64px;
}

.tap {
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.tap:focus-visible {
  outline: 6px solid var(--accent);
  outline-offset: 6px;
}

.hint {
  margin: 0;
  font-size: var(--size-min, 32px);
  color: var(--muted);
}

.icon {
  display: inline-block;
  line-height: 1;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* -- cover */

.slide[data-slide-type="cover"] .slide-body { gap: 48px; }
.slide[data-slide-type="cover"] .slide-title { font-size: 88px; }
.slide[data-slide-type="cover"] .meta { margin: 0; font-size: 44px; color: var(--muted); }
.slide[data-slide-type="cover"] .total { margin: 0; font-size: var(--size-min, 32px); color: var(--muted); }

.phase-strip {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.phase-strip li {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  min-width: 280px;
  padding: 24px 32px 28px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
  font-size: var(--size-min, 32px);
}

.phase-strip .chip {
  display: block;
  width: 100%;
  height: 20px;
  border-radius: 10px;
}

.phase-strip .icon { font-size: 56px; }
.phase-strip .label { font-weight: 700; }
.phase-strip .minutes { color: var(--muted); }

/* -- divider */

.slide[data-slide-type="divider"] .card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  min-width: 1100px;
  max-width: 100%;
}

.slide[data-slide-type="divider"] .icon { font-size: 160px; }
.slide[data-slide-type="divider"] .phase-name { margin: 0; font-size: var(--size-min, 32px); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.slide[data-slide-type="divider"] .minutes { margin: 0; font-size: 48px; color: var(--muted); }

/* -- countdown */

.countdown {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 420px;
  padding: 24px 56px;
  border: 4px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
}

.countdown .time {
  font-size: 120px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.countdown.running .time { color: var(--accent-ink); }
.countdown.done .time { color: var(--badge); }
.countdown.running { animation: pulse 2s ease-in-out infinite; }

@keyframes pulse {
  50% { box-shadow: 0 0 0 16px var(--pulse); }
}

/* -- flashcard */

.flashcard {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  width: 1400px;
  max-width: 100%;
  min-height: 780px;
}

.flashcard .picture {
  max-width: 100%;
  max-height: 420px;
  object-fit: contain;
  border-radius: calc(var(--radius) / 2);
}

.flashcard .word {
  margin: 0;
  font-size: var(--size-word, 96px);
  font-weight: 800;
  line-height: 1.1;
}

.flashcard .ipa { margin: 0; font-size: 48px; color: var(--muted); }

.flashcard .meaning {
  margin: 0;
  min-height: 1.3em;
  font-size: 56px;
  opacity: 0;
  transition: opacity 240ms ease-out;
}

.flashcard.bare .word { font-size: var(--size-word-bare, 120px); }
.flashcard.revealed .meaning { opacity: 1; }
.flashcard.revealed .hint { visibility: hidden; }

/* -- dialogue */

.dialogue {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  width: 1500px;
  max-width: 100%;
}

.chat-context { margin: 0; font-size: var(--size-min, 32px); color: var(--muted); }

.chat {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 28px;
  width: 100%;
  text-align: left;
}

.bubble {
  display: flex;
  align-items: flex-end;
  gap: 24px;
  max-width: 85%;
}

.bubble .speech, .bubble .avatar { transition: opacity 240ms ease-out, transform 240ms ease-out; }

.bubble.right {
  align-self: flex-end;
  flex-direction: row-reverse;
  text-align: right;
}

.bubble.pending .speech {
  opacity: 0;
  transform: translateY(16px);
}

.bubble.pending .avatar { opacity: 0.4; }

.avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--accent-ink);
  color: #FFFFFF;
  font-size: 48px;
  font-weight: 800;
}

.bubble.right .avatar { background: var(--accent-2-ink); }

.speech {
  margin: 0;
  padding: 24px 40px;
  border-radius: var(--radius);
  background: var(--bubble-left);
  box-shadow: var(--shadow);
  font-size: var(--size-dialogue, 44px);
}

.bubble.right .speech { background: var(--bubble-right); }
.stepper.complete .hint { visibility: hidden; }

/* -- sentence pattern */

.pattern {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  width: 1500px;
  max-width: 100%;
}

.pattern-text {
  margin: 0;
  font-size: var(--size-pattern, 56px);
  font-weight: 700;
  line-height: 1.6;
}

.slot {
  display: inline-block;
  min-width: 5ch;
  padding: 0 24px;
  border: 5px dashed var(--slot-border);
  border-radius: 16px;
  line-height: 1.2;
  color: var(--accent-ink);
}

.slot.filled {
  border-style: solid;
  background: var(--bubble-left);
}

.pattern .function { margin: 0; font-size: var(--size-min, 32px); font-style: italic; color: var(--muted); }
.example-line { margin: 0; min-height: 1.4em; font-size: var(--size-pattern, 56px); }

.examples {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px 32px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 36px;
}

.example {
  padding: 8px 28px;
  border: 3px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
}

.example.current {
  border-color: var(--accent);
  background: var(--bubble-left);
  color: var(--ink);
}

/* -- phonics */

.phonics {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.phonics .sound { margin: 0; font-size: var(--size-sound, 180px); font-weight: 800; line-height: 1; }
.phonics .letters { margin: 0; font-size: 64px; color: var(--muted); }

.phonics .words {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px 48px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 72px;
  font-weight: 700;
}

mark {
  padding: 0 8px;
  border-radius: 8px;
  background: var(--mark);
  color: inherit;
}

.chant {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: var(--size-dialogue, 44px);
  font-style: italic;
}

/* -- activity */

.activity {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  width: 100%;
}

.activity .heading {
  display: flex;
  align-items: center;
  gap: 32px;
}

.activity .heading .icon { font-size: 96px; }
.activity .instructions { margin: 0; max-width: 1500px; font-size: var(--size-dialogue, 44px); }

.steps {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
  margin: 0;
  padding: 0;
  max-width: 1640px;
  list-style: none;
}

.step {
  display: flex;
  align-items: center;
  gap: 24px;
  min-width: 520px;
  max-width: 780px;
  padding: 24px 32px;
  font-size: 36px;
  text-align: left;
}

.step .num {
  flex: none;
  display: grid;
  place-items: center;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--accent-ink);
  color: #FFFFFF;
  font-size: 40px;
  font-weight: 800;
}

.activity .countdown { min-width: 320px; padding: 12px 40px; }
.activity .countdown .time { font-size: 80px; }

/* -- summary */

.summary {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
  width: 100%;
}

.word-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
  max-width: 1700px;
}

.word-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 300px;
  margin: 0;
  padding: 24px;
  font-size: 40px;
  font-weight: 700;
}

.word-card img {
  width: 100%;
  height: 180px;
  object-fit: contain;
}

.bullets {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: var(--size-dialogue, 44px);
}

/* -- picture */

.image-ref {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  margin: 0;
  max-width: 100%;
}

.image-ref .picture {
  max-width: 100%;
  max-height: 680px;
  object-fit: contain;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.image-ref figcaption { font-size: var(--size-dialogue, 44px); }
.placeholder { margin: 0; font-size: var(--size-dialogue, 44px); font-style: italic; color: var(--muted); }

/* -- teacher layer: hidden unless <body class="teacher-mode"> */

.teacher:not(.slide) { display: none; }
body.teacher-mode .teacher:not(.slide) { display: block; }
body:not(.teacher-mode) .slide.teacher { display: none; }
body.teacher-mode:not(.notes-open) .notes { display: none; }

.slide-footer {
  position: absolute;
  left: 96px;
  right: 96px;
  bottom: 60px;
  font-size: 28px;
  color: var(--muted);
  text-align: left;
}

.badge {
  position: absolute;
  top: 48px;
  right: 96px;
  padding: 8px 24px;
  border-radius: 999px;
  background: var(--badge);
  color: #FFFFFF;
  font-size: 28px;
  font-weight: 700;
}

.notes {
  position: absolute;
  top: 56px;
  right: 96px;
  bottom: 110px;
  width: 560px;
  overflow: auto;
  padding: 28px 32px;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--teacher-bg);
  box-shadow: var(--shadow);
  font-size: 28px;
  line-height: 1.35;
  text-align: left;
}

.slide.badged .notes { top: 120px; }
.notes h2 { margin: 0 0 16px; font-size: 32px; }
.notes p { margin: 0 0 12px; }
.notes ol, .notes ul { margin: 0 0 12px; padding-left: 1.3em; }
.notes .block { margin: 0 0 16px; padding: 12px 16px; border-left: 6px solid var(--line); }
.notes .origin { color: var(--muted); font-size: 24px; }
.notes .ai-note { font-weight: 700; color: var(--badge); }

.slide.teacher .slide-body {
  justify-content: flex-start;
  align-items: stretch;
  overflow: auto;
  font-size: 32px;
  text-align: left;
}

.slide.teacher .slide-title { font-size: 56px; margin-bottom: 16px; }
.warnings { margin: 0; padding-left: 1.2em; }

.source-map {
  width: 100%;
  border-collapse: collapse;
  font-size: 28px;
}

.source-map th, .source-map td {
  padding: 10px 14px;
  border-bottom: 2px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.source-map th { background: var(--bubble-left); }

/* -- progress dots */

.dots {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0;
  padding: 0 200px;
}

.dot {
  position: relative;
  width: 48px;
  height: 48px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  cursor: pointer;
}

.dot::before {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  background: var(--line);
  opacity: 0.55;
}

.dot.current::before { opacity: 1; transform: scale(1.4); }

/* -- motion and print */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

@media print {
  @page { size: landscape; margin: 10mm; }
  html, body { height: auto; overflow: visible; background: #FFFFFF; }
  .stage-wrap { position: static; }
  .stage {
    position: static;
    width: auto;
    height: auto;
    overflow: visible;
    transform: none !important;
  }
  .slide, .slide.teacher {
    display: block !important;
    position: relative;
    inset: auto;
    width: 1920px;
    height: auto;
    margin: 0 0 24px;
    padding-bottom: 72px;
    border: 2px solid var(--line);
    animation: none;
    zoom: 0.5;
    break-after: page;
    page-break-after: always;
  }
  .slide .slide-body { min-height: 880px; margin-right: 0 !important; }
  .teacher:not(.slide), .notes { display: block !important; }
  .notes {
    position: static;
    width: auto;
    margin-top: 24px;
    box-shadow: none;
  }
  .slide-footer { position: static; margin-top: 16px; }
  .bubble.pending .speech, .bubble.pending .avatar { opacity: 1 !important; transform: none !important; }
  .flashcard .meaning { opacity: 1 !important; }
  .hint, .dots { display: none !important; }
}
</style>
<style>
/* --- theme: {{theme}} ---------------------------------------------------------------------- */
{{theme_css}}
</style>
</head>
<body data-theme="{{theme}}" data-lesson-id="{{lesson_id}}">
<div class="stage-wrap" id="stage-wrap">
<div class="stage" id="stage" role="region" aria-roledescription="slide deck" aria-label="{{title}}">
{{slides}}
<nav class="dots ui" id="dots" aria-label="Slide progress"></nav>
</div>
</div>
<script>
{{script}}
</script>
</body>
</html>
