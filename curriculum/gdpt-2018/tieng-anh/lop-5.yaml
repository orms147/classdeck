grammar_scope:
  allowed:                        # documentation for the prompt; not machine-checked
    - "present simple with be and have, imperatives, this / that, What's ...? / How ...?"
    - "grade 4 structures: can, present continuous, like + -ing, days, months, Where / When / What time"
    - "past simple, regular and common irregular verbs (went, saw, ate, took, had)"
    - "Did you ...? / Yes, I did. / No, I did not."
    - "going to for plans: What are you going to ...? I'm going to ..."
    - "will for offers: I'll help you."
    - "because for simple reasons"
    - "comparatives of short adjectives and better / worse, with than"
    - "numbers 1-100"
  forbidden:                      # regexes checked by english.grammar_scope (case-insensitive); past simple is in scope at grade 5
    - id: perfect
      pattern: '(?:\b(?:has|have|had)(?:n[\x27’]t)?|[\x27’]ve)(?:\s+(?:not|never|already|just|ever))?\s+(?:been|done|gone|eaten|seen|taken|given|written|broken|chosen|spoken|known|shown|driven|fallen|forgotten|begun|drunk|sung|swum|worn|torn|woken|grown|drawn|thrown|flown|blown|ridden|hidden|bitten|stolen|frozen|beaten|made|found|lost|met|heard|told|said|bought|brought|thought|taught|caught|left|felt|kept|slept|built|sent|spent|won|held|read|run|come|become|put|sat|stood|\w{3,}ed)\b'
      note: "perfect tenses"
    - id: passive
      pattern: '(?:\b(?:am|is|are|was|were|be|been|being)(?:n[\x27’]t)?|[\x27’](?:s|re))(?:\s+not)?\s+(?:been|done|gone|eaten|seen|taken|given|written|broken|chosen|spoken|known|shown|driven|fallen|forgotten|begun|drunk|sung|swum|worn|torn|woken|grown|drawn|thrown|flown|blown|ridden|hidden|bitten|stolen|frozen|beaten|made|found|lost|met|heard|told|said|bought|brought|thought|taught|caught|left|felt|kept|slept|built|sent|spent|won|held|read|run|come|become|put|sat|stood|\w{3,}ed)\s+by\b'
      note: "passive voice"

textbooks:                        # optional; maps known books to units when one is uploaded
  - series: global-success
    volume: 1

units:
  - id: ta5.u1
    title: "Where I live"
    textbook_units: [ { series: global-success, unit: 1 } ]
    lessons: 3
    outcomes:
      - id: ta5.u1.o1
        text: Ask and answer about where one lives using "Where do you live?" / "I live in ...".
        skills: [listening, speaking]
        keywords: [ask, answer, live, village, town, city]
      - id: ta5.u1.o2
        text: Give an address and say what is near one's home using "What is your address?" / "My house is near ...".
        skills: [listening, speaking]
        keywords: [address, near, street, road, house]
      - id: ta5.u1.o3
        text: Read and write short sentences that describe one's home and neighbourhood.
        skills: [reading, writing]
        keywords: [read, write, describe, home, neighbourhood, quiet, busy]
    vocabulary: [live, address, village, neighbour, neighbourhood, road, street, near, noisy, quiet, busy, beautiful, map]
    patterns:
      - { pattern: "Where do you live?", function: asking where someone lives }
      - { pattern: "I live in a ___.", function: saying where one lives }
      - { pattern: "What is your address?", function: asking for an address }
      - { pattern: "My house is near the ___.", function: saying what is near one's home }
    phonics:
      - { sound: "/v/", letters: "v", words: [village, very, live] }
      - { sound: "/r/", letters: "r", words: [road, river, rice] }

  - id: ta5.u2
    title: "Last weekend"
    textbook_units: [ { series: global-success, unit: 2 } ]
    lessons: 3
    outcomes:
      - id: ta5.u2.o1
        text: Ask and answer about last weekend using "What did you do ...?" and regular past simple verbs.
        skills: [listening, speaking]
        keywords: [ask, answer, weekend, past, visited, watched]
      - id: ta5.u2.o2
        text: Ask and answer about places visited using "Did you ...?" / "Yes, I did." / "No, I did not." and went, saw, ate.
        skills: [listening, speaking]
        keywords: [did, went, saw, ate, "yes", "no", visit]
      - id: ta5.u2.o3
        text: Read and write short sentences about what one did last weekend.
        skills: [reading, writing]
        keywords: [read, write, weekend, past, sentence]
    vocabulary: [last, weekend, yesterday, ago, visit, watch, clean, cook, aunt, cousin, grandmother, went, saw, ate]
    patterns:
      - { pattern: "What did you do last weekend?", function: asking about the past }
      - { pattern: "I visited my ___.", function: saying what one did }
      - { pattern: "Did you go to the ___?", function: asking about a past event }
      - { pattern: "Yes, I did. / No, I did not.", function: giving a short answer }
    phonics:
      - { sound: "/t/", letters: "ed", words: [watched, cooked, jumped] }
      - { sound: "/d/", letters: "ed", words: [played, cleaned, stayed] }

  - id: ta5.u3
    title: "Our holiday"
    textbook_units: [ { series: global-success, unit: 3 } ]
    lessons: 3
    outcomes:
      - id: ta5.u3.o1
        text: Ask and answer about a holiday using "Where did you go?" / "How did you get there?" and by + transport.
        skills: [listening, speaking]
        keywords: [holiday, went, travel, train, plane, boat, bus]
      - id: ta5.u3.o2
        text: Say what one saw and did on a trip using past simple verbs.
        skills: [speaking, writing]
        keywords: [trip, saw, took, swam, photo, beach]
      - id: ta5.u3.o3
        text: Read a short holiday message and answer questions about it.
        skills: [reading, writing]
        keywords: [read, holiday, message, answer]
    vocabulary: [holiday, trip, travel, train, plane, boat, hotel, island, beach, photo, sea, ticket]
    patterns:
      - { pattern: "Where did you go on holiday?", function: asking about a trip }
      - { pattern: "I went to ___ by ___.", function: saying where and how one travelled }
      - { pattern: "How was the trip?", function: asking for an opinion about the past }
    phonics:
      - { sound: "/p/", letters: "p", words: [plane, photo, park] }
      - { sound: "/ʃ/", letters: "sh", words: [shell, ship, shop] }

  - id: ta5.u4
    title: "What I will be"
    textbook_units: [ { series: global-success, unit: 4 } ]
    lessons: 3
    outcomes:
      - id: ta5.u4.o1
        text: Ask and answer about plans using "What are you going to ...?" / "I'm going to ...".
        skills: [listening, speaking]
        keywords: [plan, going, tomorrow, weekend, future]
      - id: ta5.u4.o2
        text: Talk about future jobs using "What do you want to be?" and "I want to be a ...".
        skills: [speaking]
        keywords: [job, want, be, doctor, pilot, farmer]
      - id: ta5.u4.o3
        text: Offer help using "I'll ...".
        skills: [listening, speaking, writing]
        keywords: [offer, help, will]
    vocabulary: [future, plan, dream, become, soon, tomorrow, tonight, want, going, will, help]
    patterns:
      - { pattern: "What are you going to do tomorrow?", function: asking about plans }
      - { pattern: "I'm going to ___.", function: saying what one plans to do }
      - { pattern: "What do you want to be?", function: asking about a future job }
      - { pattern: "I'll help you.", function: offering help }
    phonics:
      - { sound: "/g/", letters: "g", words: [going, garden, grow] }
      - { sound: "/w/", letters: "w", words: [will, want, work] }

  - id: ta5.u5
    title: "Healthy days"
    textbook_units: [ { series: global-success, unit: 5 } ]
    lessons: 3
    outcomes:
      - id: ta5.u5.o1
        text: Ask and answer about feelings and health using "What's the matter?" / "I have a ...".
        skills: [listening, speaking]
        keywords: [matter, headache, cold, tired, ill, health]
      - id: ta5.u5.o2
        text: Give reasons using "because" and choose healthy food.
        skills: [speaking, writing]
        keywords: [because, healthy, food, fruit, vegetables]
      - id: ta5.u5.o3
        text: Compare two things using short comparatives and "than".
        skills: [reading, speaking]
        keywords: [compare, than, better, healthier, bigger]
    vocabulary: [healthy, matter, headache, toothache, tired, hungry, because, fruit, vegetables, sweets, better, than]
    patterns:
      - { pattern: "What's the matter?", function: asking about a problem }
      - { pattern: "I have a ___.", function: saying what is wrong }
      - { pattern: "I like ___ because it is ___.", function: giving a reason }
      - { pattern: "___ is healthier than ___.", function: comparing two things }
    phonics:
      - { sound: "/θ/", letters: "th", words: [than, thirsty, thirty] }
      - { sound: "/h/", letters: "h", words: [healthy, headache, hungry] }
